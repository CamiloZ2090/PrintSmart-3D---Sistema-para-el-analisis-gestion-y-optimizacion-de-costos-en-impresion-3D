<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PrintSmart 3D</title>

  <!--Favicon-->
  <link rel="icon" type="image/jpeg" href="assets/logo2.jpeg"/>

  <!-- Bootstrap 5 (estilos) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <!-- Iconos de Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <!-- Fuente Inter de Google -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>

  <!-- Nuestros CSS propios -->
  <link rel="stylesheet" href="css/variables.css"/>
  <link rel="stylesheet" href="css/login.css"/>
</head>
<body>

  <!-- PANTALLA DE LOGIN-->
<div class="login-page">
    <div class="login-card">

      <!-- Logo -->
      <div class="login-logo">
        <img src="assets/logo2.jpeg" alt="Logo PrintSmart 3D">
      </div>

      <div class="text-center mb-4">
        <h2 class="login-titulo">PrintSmart 3D</h2>
        <p class="login-subtitulo">Sistema para el analisis gestion y optimizacion de costos en impresion 3D</p>
      </div>

      <!-- Selector de Rol -->
      <p class="label-rol">Selecciona tu Rol</p>
      <div class="role-tabs" id="roleTabs">
        <button class="tab-rol activo" onclick="selectRole('Admin', this)">Admin</button>
        <button class="tab-rol" onclick="selectRole('Operador', this)">
            <i class="bi bi-lock" style="font-size:11px; margin-right:3px;"></i>Operador
        </button>
        <button class="tab-rol" onclick="selectRole('Cliente', this)">
            <i class="bi bi-lock" style="font-size:11px; margin-right:3px;"></i>Cliente
        </button>
      </div>

      <!-- Descripción del rol seleccionado -->
        <div class="role-desc mb-4">
            <i class="bi bi-info-circle" id="roleDescIcono"></i>
            <span id="roleDescTexto">
                Acceso total: usuarios, configuración, reportes financieros y control de toda la operación.
            </span>
        </div>

        <!-- Campos bloqueables -->

      <div id="formularioLogin">

        <!-- Campo Email -->
        <label class="campo-label">Correo Electrónico</label>
        <div class="campo-wrapper mb-3">
          <i class="bi bi-envelope campo-icono"></i>
          <input type="email" class="campo-input" id="emailInput"
                 placeholder="Ingrese su correo electronico"/>
        </div>

        <!-- Campo Contraseña -->
        <div class="d-flex justify-content-between mb-1">
          <label class="campo-label">Contraseña</label>
          <a href="#" class="link-olvide">¿Olvidaste tu contraseña?</a>
        </div>
        <div class="campo-wrapper mb-3">
          <i class="bi bi-lock campo-icono"></i>
          <input type="password" class="campo-input" id="passInput"
                 placeholder="••••••••" style="padding-right: 40px;"/>
          <span class="campo-ojo" onclick="toggleContrasena()">
            <i class="bi bi-eye" id="iconoOjo"></i>
          </span>
        </div>

        <!-- Recordar sesión -->
        <div class="d-flex align-items-center gap-2 mb-4">
          <input type="checkbox" id="recordar" class="check-custom"/>
          <label for="recordar" class="check-label">Mantener sesión iniciada</label>
        </div>

      </div><!-- fin formularioLogin -->

      <!-- Mensaje de error (reemplaza el alert) -->
      <div class="alerta-error" id="mensajeError"></div>

      <!-- Botón Iniciar Sesión -->
      <button class="btn-login" id="btnLogin" onclick="iniciarSesion()">
        Iniciar Sesión &nbsp;<i class="bi bi-arrow-right"></i>
      </button>
      <p class="texto-soporte mt-4">
        ¿Eres un cliente nuevo?
        <a href="#" class="link-soporte">Contactar Soporte</a>
      </p>

    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Nuestro JS de Login -->
  <script src="js/login.js"></script>

</body>
</html>
